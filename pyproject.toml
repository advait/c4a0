[project]
name = "c4a0"
version = "0.1.0"
description = ""
authors = [{ name = "Advait Shinde", email = "advait.shinde@gmail.com" }]
dependencies = [
  "pytorch-lightning>=2.6.5",
  "numpy>=2.4.6",
  "einops>=0.8.2",
  "torchmetrics>=1.9.0",
  "tensorboardx>=2.6.5",
  "tensorboard>=2.21.0",
  "tqdm>=4.68.3",
  "pydantic>=2.13.4",
  "tabulate>=0.10.0",
  "matplotlib>=3.11.0",
  "loguru>=0.7.3",
  "typer>=0.26.8",
  "optuna>=4.9.0",
  "optuna-dashboard>=0.20.0",
  "torch>=2.12.1",
]
readme = "README.md"
requires-python = "==3.11.15"

[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
python-packages = ["c4a0", "c4a0_rust"]
module-name = "c4a0_rust._native"

[dependency-groups]
dev = [
  "maturin==1.14.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ty==0.0.99",
  "ruff>=0.15.20",
]

notebook = ["jupyterlab>=4.6.1", "pandas>=3.0.3", "rankit>=0.3.3"]

# Both ty and Ruff infer the target Python version from project.requires-python.
[tool.ty.environment]
root = ["src", "tests"]

[tool.ty.src]
include = ["src", "tests"]
# Exploratory notebooks are not part of the training package or CI.
exclude = ["**/*.ipynb"]

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.rules]
# Keep all default diagnostics, and make these boundaries explicit errors.
invalid-argument-type = "error"
invalid-assignment = "error"
invalid-return-type = "error"
invalid-method-override = "error"
missing-argument = "error"
missing-type-argument = "error"
call-non-callable = "error"
import-not-found = "error"
unresolved-reference = "error"
unresolved-attribute = "error"
unused-ignore-comment = "error"
ignore-comment-unknown-rule = "error"
blanket-ignore-comment = "error"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  # Disable warnings we get form pytorch lightning that clutter pytest output
  "ignore:pkg_resources is deprecated.*:DeprecationWarning",
  "ignore:Deprecated call to `pkg_resources.declare_namespace`.*:DeprecationWarning",
  "ignore:Deprecated call to `pkg_resources.declare_namespace.*:DeprecationWarning",
  "ignore:You are trying to `self.log()` but the `self.trainer` reference is not registered on the model yet.*",
]
