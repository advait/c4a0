min_version = "2026.1.6"

[task_config]
dir = "{{config_root}}"

[tools]
rust = { version = "stable", targets = "wasm32-unknown-unknown" }
uv = "0.13.7"
# Must equal the wasm-bindgen crate version in rust/web/Cargo.toml.
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"

[env]
UV_LINK_MODE = "copy"

[tasks.install]
description = "Install Python dependencies and build the editable package with uv"
run = "uv sync --locked"
sources = [
  "pyproject.toml",
  "uv.lock",
  "rust/Cargo.toml",
  "rust/Cargo.lock",
  "rust/src/**/*",
  "src/**/*",
]
outputs = [".venv/pyvenv.cfg"]

[tasks."install:update"]
description = "Install dependencies and allow uv.lock updates"
run = "uv sync"

# Build

[tasks.build]
description = "Build/install the optimized PyO3 extension into the uv environment"
depends = ["install"]
run = "uv run --locked maturin develop --release"

# Validation

[tasks.check]
description = "Run lint, typecheck, Rust tests, and Python tests"
run = [
  { task = "lint" },
  { task = "typecheck" },
  { task = "test:rust" },
  { task = "test:python" },
]

[tasks.lint]
description = "Run Ruff lint and formatting checks"
depends = ["install"]
run = ["uv run --locked ruff check", "uv run --locked ruff format --check"]

[tasks.typecheck]
description = "Run ty type checks"
depends = ["install"]
run = "uv run --locked ty check --error-on-warning"

[tasks.test]
description = "Run all Rust and Python tests"
depends = ["test:rust", "test:python"]

[tasks."test:rust"]
description = "Run Rust unit and property tests"
dir = "{{config_root}}/rust"
run = "cargo test --workspace"

[tasks."test:python"]
description = "Run Python tests"
depends = ["build"]
# Timeout: self-play can deadlock at shutdown (see verify skill); fail fast instead of hanging.
run = "timeout 300 uv run --locked pytest -q"

[tasks.ci]
description = "Run the full CI validation suite"
run = [
  { task = "lint" },
  { task = "typecheck" },
  { task = "test:rust" },
  { task = "test:python" },
  { task = "train:smoke" },
]

# Solver labels

[tasks."suite:build"]
description = "Rebuild the committed v1 dev/test solver suites (byte-identical; no book needed)"
depends = ["build"]
run = "uv run --locked python src/c4a0/main.py build-suite"

# Training / app lifecycle

[tasks.train]
description = "Train generations with the winning defaults in training/ (accepts train options)"
depends = ["build"]
run = "uv run --locked python src/c4a0/main.py train"

[tasks.play]
description = "Play the shipped final model in the TUI (or pass --model latest|uniform|random|<path>)"
depends = ["build"]
run = "uv run --locked python src/c4a0/main.py play"

[tasks.eval]
description = "Backfill or rescore saved generations (accepts eval options)"
depends = ["build"]
run = "uv run --locked python src/c4a0/main.py eval"

[tasks.report]
description = "Summarize a directory of training runs (pass the directory and report options)"
depends = ["build"]
run = "uv run --locked python scripts/converge_report.py"

[tasks.plot]
description = "Regenerate the README figures: the training-progress graph (from docs/data/training-progress.json) and the network diagram"
depends = ["install"]
run = [
  "uv run --locked python scripts/plot_progress.py",
  "uv run --locked python scripts/plot_architecture.py",
]

[tasks.hero]
description = "Regenerate the README hero GIFs (images/hero-light.gif, images/hero-dark.gif) from models/c4a0-final.pkl and the real search"
depends = ["install"]
run = "uv run --locked python scripts/render_hero.py"

# Browser player (web/, published to https://c4a0.advait.lol)

[tasks."web:build"]
description = "Build the browser player into web/dist: the search as WebAssembly, the final model's weights and the page"
depends = ["install"]
run = [
  # The tools entry's `targets` is not applied when CI restores a cached toolchain.
  "rustup target add wasm32-unknown-unknown",
  "cargo build --manifest-path rust/Cargo.toml -p c4a0_web --release --target wasm32-unknown-unknown",
  "rm -rf web/dist",
  "wasm-bindgen --target web --no-typescript --out-dir web/dist/pkg rust/target/wasm32-unknown-unknown/release/c4a0_web.wasm",
  "uv run --locked python scripts/export_web.py web/dist/model",
  "cp web/index.html web/app.js web/net.js web/style.css web/CNAME web/dist/",
]

[tasks.web]
description = "Build the browser player and serve it at http://localhost:8000"
depends = ["web:build"]
run = "uv run --locked python -m http.server --bind 127.0.0.1 --directory web/dist 8000"

[tasks."web:test"]
description = "Check the browser player in headless Chrome: GPU output against PyTorch, then a full game"
depends = ["web:build"]
run = "uv run --locked python scripts/web_test.py web/dist"

[tasks."train:smoke"]
description = "Run a fast CPU end-to-end smoke training job"
depends = ["build"]
run = '''
set -eu
rm -rf training/ci-smoke
timeout 900 uv run --locked python src/c4a0/main.py train \
  --base-dir training/ci-smoke \
  --device cpu \
  --n-self-play-games 4 \
  --n-mcts-iterations 4 \
  --self-play-batch-size 16 \
  --training-batch-size 16 \
  --n-residual-blocks 1 \
  --conv-filter-size 8 \
  --lr-schedule 0 \
  --lr-schedule 0.001 \
  --l2-reg 0 \
  --train-anneal-epochs 2 \
  --eval-mcts-iterations 4 \
  --max-gens 1
'''

# Solver (rust/src/native_solver). Labeling runs in process and needs no setup; the opening book
# only speeds large `main.py label` jobs.

[tasks."solver:build"]
description = "Build the solver CLI (rust/target/release/c4native)"
dir = "{{config_root}}/rust"
run = "cargo build --release --bin c4native"

[tasks."solver:book"]
description = "Generate the solver's opening book for `main.py label` (ply 10: about 22 min on 32 cores; skipped if present)"
depends = ["solver:build"]
run = '''
ply="${C4NATIVE_BOOK_PLY:-10}"
book="native-solver/book-ply$ply.bin"
test -f "$book" && { echo "$book exists; delete it to rebuild"; exit 0; }
mkdir -p native-solver
timeout 7200 nice -n 10 rust/target/release/c4native book --ply "$ply" --tt-mb "${C4NATIVE_BOOK_TT_MB:-8192}" --out "$book.tmp"
mv "$book.tmp" "$book"
sha256sum "$book"
'''
